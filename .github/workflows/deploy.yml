name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (main → prod, dev → staging)"
        required: true
        type: choice
        options:
          - dev
          - main

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          chmod +x scripts/deploy.sh
          case "$DEPLOY_BRANCH" in
            main|dev) ./scripts/deploy.sh "$DEPLOY_BRANCH" ;;
            *) echo "Refusing unknown branch: $DEPLOY_BRANCH" >&2; exit 1 ;;
          esac
