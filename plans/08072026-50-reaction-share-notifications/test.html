<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction and Share Notifications — Acceptance</title><style>:root{--ink:#111;--line:#d7d7d7;--soft:#f5f5f5;--muted:#666;--pass:#147a3f}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.5 system-ui,sans-serif}.shell{width:min(940px,calc(100% - 32px));margin:auto;padding:36px 0}header,.item{border:1px solid var(--line);border-radius:9px;padding:20px;margin-bottom:14px}h1{margin:0 0 6px}.meta{color:var(--muted)}button{font:inherit;font-weight:700;padding:8px 12px;border:1px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer}.tools{display:flex;gap:10px;margin:16px 0}.item{background:var(--soft)}.item.pass{border-left:4px solid var(--pass)}.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase}dt{font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin-top:9px}dd{margin:2px 0}ol{margin:3px 0;padding-left:22px}</style></head><body><main class="shell"><header><h1 id="title">Acceptance checklist</h1><p class="meta" id="meta"></p><strong id="status">Not Run</strong></header><div class="tools"><input id="file" type="file" accept="application/json" hidden><button id="load">Load results</button><button id="save">Download results</button></div><div id="items"></div></main><script>let data;const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','>':'&gt;','<':'&lt;'}[c]));function rollup(){const x=data.items;if(x.some(i=>i.status==='fail'&&!i.waiver))return'Failed';if(x.every(i=>i.status==='pass'||(i.status==='fail'&&i.waiver)))return'Passed';if(x.some(i=>i.status!=='pending'))return'In Progress';return'Not Run'}function render(){$('title').textContent=data.plan;$('meta').textContent='Generated '+data.generatedAt;$('status').textContent=rollup();$('items').innerHTML=data.items.map((i,n)=>`<article class="item ${i.status}"><label><input type="checkbox" data-n="${n}" ${i.status==='pass'?'checked':''}> <strong>${e(i.id)} — ${e(i.title)}</strong> <span class="tag">${e(i.surface)}</span></label><dl><dt>Precondition</dt><dd>${e(i.precondition)}</dd><dt>Steps</dt><dd><ol>${i.steps.map(s=>`<li>${e(s)}</li>`).join('')}</ol></dd><dt>Expected</dt><dd>${e(i.expected)}</dd><dt>Evidence</dt><dd contenteditable data-e="${n}">${e(i.evidence)}</dd><dt>Notes</dt><dd>${e(i.notes)}</dd></dl></article>`).join('');document.querySelectorAll('[data-n]').forEach(x=>x.onchange=()=>{data.items[x.dataset.n].status=x.checked?'pass':'pending';render()});document.querySelectorAll('[data-e]').forEach(x=>x.oninput=()=>data.items[x.dataset.e].evidence=x.textContent)}$('load').onclick=()=>$('file').click();$('file').onchange=x=>{const r=new FileReader;r.onload=()=>{data=JSON.parse(r.result);render()};r.readAsText(x.target.files[0])};$('save').onclick=()=>{data.status=rollup();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='test-results.json';a.click()};fetch('./test-results.json').then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>{});</script></body></html>
