<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single-Photo General Comments Acceptance</title><style>:root{--ink:#111;--muted:#666;--line:#ddd;--soft:#f6f6f6;--pass:#087a34;--fail:#a41e22}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,sans-serif}main{width:min(940px,calc(100% - 32px));margin:auto;padding:40px 0}header,article{border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}header{border-color:var(--ink)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{border-radius:999px;background:var(--ink);color:#fff;padding:5px 10px;font-size:.75rem;font-weight:800;text-transform:uppercase}article.pass{border-left:4px solid var(--pass)}article.fail{border-left:4px solid var(--fail)}h1,h3{margin-top:0}h3{font-size:1rem}dt{margin-top:10px;color:var(--muted);font-size:.72rem;font-weight:800;text-transform:uppercase}dd{margin:2px 0 0}ol{margin:4px 0 0 20px;padding:0}button{margin:0 8px 12px 0;border:1px solid var(--ink);border-radius:7px;background:#fff;padding:7px 11px;font:inherit;font-weight:700;cursor:pointer}.notice{padding:12px;border:1px dashed var(--line);border-radius:7px;background:var(--soft)}</style></head><body><main><header><div class="top"><div><p style="margin:0;color:#666;font-size:.76rem;font-weight:800;text-transform:uppercase">Socmed acceptance checklist</p><h1 id="title">Single-Photo General Comments Acceptance</h1></div><span id="pill" class="pill">Not Run</span></div><p id="meta" style="margin-bottom:0;color:#666"></p></header><input id="file" type="file" accept="application/json" hidden><button id="load">Load results file</button><button id="download">Download updated results</button><div id="notice" class="notice" hidden></div><div id="list"></div></main><script>let data;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rollup=d=>!d?.items?.length?'Not Run':d.items.some(i=>i.status==='fail'&&!i.waiver)?'Failed':d.items.every(i=>i.status==='pass'||(i.status==='fail'&&i.waiver))?'Passed':d.items.some(i=>i.status!=='pending')?'In Progress':'Pending';function render(){if(!data)return;const status=rollup(data);data.status=status;$('title').textContent=data.plan;$('meta').textContent=`Generated ${data.generatedAt||'—'}`;$('pill').textContent=status;$('list').innerHTML=data.items.map((item,index)=>`<article class="${item.status}"><h3><input type="checkbox" data-index="${index}" ${item.status==='pass'?'checked':''}> ${esc(item.id)} — ${esc(item.title)} <small>(${esc(item.surface)})</small></h3><dl><dt>Precondition</dt><dd>${esc(item.precondition)}</dd><dt>Steps</dt><dd><ol>${item.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol></dd><dt>Expected</dt><dd>${esc(item.expected)}</dd>${item.evidence?`<dt>Evidence</dt><dd>${esc(item.evidence)}</dd>`:''}${item.notes?`<dt>Notes</dt><dd>${esc(item.notes)}</dd>`:''}${item.waiver?`<dt>Waiver</dt><dd>${esc(item.waiver)}</dd>`:''}</dl></article>`).join('');document.querySelectorAll('[data-index]').forEach(input=>input.addEventListener('change',e=>{data.items[+e.target.dataset.index].status=e.target.checked?'pass':'pending';render()}))}function show(message){const n=$('notice');n.hidden=false;n.textContent=message}$('load').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{data=JSON.parse(reader.result);$('notice').hidden=true;render()}catch(error){show(`Could not parse JSON: ${error.message}`)}};reader.readAsText(f)};$('download').onclick=()=>{if(!data)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='test-results.json';a.click()};fetch('./test-results.json').then(r=>r.json()).then(result=>{data=result;render()}).catch(()=>show('Auto-load is blocked on file://. Use Load results file.'));</script></body></html>
