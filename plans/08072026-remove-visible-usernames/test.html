<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Visible Usernames — Acceptance</title><style>body{max-width:900px;margin:30px auto;padding:0 18px;font:16px/1.5 system-ui,sans-serif;background:#f4f7fb;color:#172033}main,article{background:#fff;border:1px solid #d8e0ea;border-radius:10px;padding:22px;margin:14px 0}select,input,button{font:inherit;padding:6px 8px}button{background:#194a8d;color:#fff;border:0;border-radius:5px}.pass{border-left:5px solid #2f855a}.fail{border-left:5px solid #c53030}pre{white-space:pre-wrap}</style></head><body><main><h1>Remove Visible Usernames — Acceptance</h1><p id="summary">Loading…</p><div id="items"></div><button id="save">Download updated test-results.json</button></main><script>
let report;const root=document.getElementById("items"),summary=document.getElementById("summary");
function esc(v){return String(v).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function render(){const pass=report.items.filter(function(x){return x.status==="pass"}).length,fail=report.items.filter(function(x){return x.status==="fail"}).length;report.status=fail?"Needs Review":pass===report.items.length?"Passed":"Pending";summary.textContent=report.status+" — "+pass+"/"+report.items.length+" passed";root.innerHTML="";report.items.forEach(function(item){const a=document.createElement("article");a.className=item.status==="pass"?"pass":item.status==="fail"?"fail":"";a.innerHTML="<h2>"+esc(item.id)+" — "+esc(item.title)+"</h2><p><b>Surface:</b> "+esc(item.surface)+"</p><p><b>Precondition:</b> "+esc(item.precondition)+"</p><pre>"+item.steps.map(function(s,i){return(i+1)+". "+s}).join("\n")+"</pre><p><b>Expected:</b> "+esc(item.expected)+"</p><label>Status <select><option value=pending>Pending</option><option value=pass>Pass</option><option value=fail>Fail</option></select></label> <label>Evidence <input size=46></label>";const select=a.querySelector("select"),evidence=a.querySelector("input");select.value=item.status;evidence.value=item.evidence||"";select.onchange=function(){item.status=select.value;render()};evidence.oninput=function(){item.evidence=evidence.value||null};root.appendChild(a)})}
document.getElementById("save").onclick=function(){const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)+"\n"],{type:"application/json"}));link.download="test-results.json";link.click();URL.revokeObjectURL(link.href)};
fetch("test-results.json").then(function(r){if(!r.ok)throw Error("Serve this folder over HTTP, then reload.");return r.json()}).then(function(d){report=d;render()}).catch(function(e){summary.textContent=e.message});
</script></body></html>
