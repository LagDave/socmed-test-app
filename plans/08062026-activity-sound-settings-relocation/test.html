<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceptance checklist</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:40px auto;max-width:900px;padding:0 16px}article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}small{color:#666}button{padding:8px 12px}</style></head><body><h1>Acceptance checklist</h1><p id="status"></p><main id="items"></main><button id="download">Download updated results</button><script>let data;const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(){document.querySelector("#status").textContent=`${data.plan} · ${data.status}`;document.querySelector("#items").innerHTML=data.items.map((item,index)=>`<article><label><input type="checkbox" data-index="${index}" ${item.status==="pass"?"checked":""}> <strong>${esc(item.title)}</strong></label><p>${esc(item.expected)}</p><small>${esc(item.evidence)}</small></article>`).join("");document.querySelectorAll("input").forEach(input=>input.onchange=event=>{data.items[event.target.dataset.index].status=event.target.checked?"pass":"pending";data.status=data.items.every(item=>item.status==="pass")?"Passed":"In Progress";render()})}fetch("./test-results.json").then(response=>response.json()).then(result=>{data=result;render()});document.querySelector("#download").onclick=()=>{const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));link.download="test-results.json";link.click()};</script></body></html>
