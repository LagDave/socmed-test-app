<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Avatar fallback acceptance</title><style>:root { --ink:#172033; --muted:#5b6577; --line:#d9e0ea; --soft:#f7f9fc; --pass:#0a6b2e; --fail:#9b1c1c; } * { box-sizing:border-box; } body { max-width:900px; margin:0 auto; padding:32px 20px; color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; } header,.item { border:1px solid var(--line); border-radius:12px; padding:18px; } header { background:var(--soft); } h1 { margin:0 0 6px; } .item { margin-top:14px; } .item.pass { border-left:4px solid var(--pass); } .item.fail { border-left:4px solid var(--fail); } .meta { color:var(--muted); } button { margin:16px 0 4px; border:1px solid var(--ink); border-radius:7px; padding:8px 12px; background:#fff; font:inherit; font-weight:700; cursor:pointer; } ol { margin-bottom:0; } code { background:var(--soft); padding:2px 4px; border-radius:4px; }</style></head>
<body><header><h1 id="title">Acceptance tests</h1><p id="status" class="meta"></p><input id="file" type="file" accept="application/json" hidden><button id="load">Load results file</button><button id="download">Download updated results</button></header><main id="items"></main><script>let data; const escape = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char]); const rollup = () => data.items.every(item => item.status === "pass" || (item.status === "fail" && item.waiver)) ? "Passed" : data.items.some(item => item.status === "fail" && !item.waiver) ? "Failed" : data.items.some(item => item.status === "pass") ? "In Progress" : "Not Run"; function render() { data.status = rollup(); document.querySelector("#title").textContent = data.plan; document.querySelector("#status").textContent = `Status: ${data.status} · generated ${data.generatedAt}`; document.querySelector("#items").innerHTML = data.items.map((item, index) => `<section class="item ${item.status}"><h2><label><input type="checkbox" data-index="${index}" ${item.status === "pass" ? "checked" : ""}> ${escape(item.id)} — ${escape(item.title)}</label></h2><p class="meta">${escape(item.surface)}</p><p><strong>Precondition:</strong> ${escape(item.precondition)}</p><strong>Steps:</strong><ol>${item.steps.map(step => `<li>${escape(step)}</li>`).join("")}</ol><p><strong>Expected:</strong> ${escape(item.expected)}</p><p><strong>Evidence:</strong> ${escape(item.evidence || "Not recorded")}</p></section>`).join(""); document.querySelectorAll("input[type=checkbox]").forEach(box => box.addEventListener("change", event => { data.items[event.target.dataset.index].status = event.target.checked ? "pass" : "pending"; render(); })); } document.querySelector("#load").onclick = () => document.querySelector("#file").click(); document.querySelector("#file").onchange = event => { const reader = new FileReader(); reader.onload = () => { data = JSON.parse(reader.result); render(); }; reader.readAsText(event.target.files[0]); }; document.querySelector("#download").onclick = () => { const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" })); link.download = "test-results.json"; link.click(); }; fetch("./test-results.json").then(response => response.json()).then(result => { data = result; render(); }).catch(() => { document.querySelector("#status").innerHTML = "Load <code>test-results.json</code> to begin."; });</script></body>
</html>
