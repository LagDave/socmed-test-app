<!doctype html><html lang="en"><meta charset="utf-8"><title>Presence acceptance</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px}li{margin:12px 0}.pass{color:#076b2c}.pending{color:#665c00}</style><h1>Friend-only online presence acceptance</h1><p id="status"></p><ol id="items"></ol><script>fetch('./test-results.json').then(r=>r.json()).then(d=>{status.textContent='Status: '+d.status;items.innerHTML=d.items.map(i=>`<li class="${i.status}"><strong>${i.id}: ${i.title}</strong> — ${i.status}<br>${i.expected}<br><small>${i.evidence||i.notes}</small></li>`).join('')})</script></html>
