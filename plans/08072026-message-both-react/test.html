<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceptance Checklist — Both Message Reactions</title><style>body{max-width:850px;margin:36px auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#111}article{border:1px solid #ddd;border-radius:8px;padding:18px;margin:14px 0}h1{line-height:1.1}textarea{width:100%;min-height:56px;margin-top:8px}button{padding:9px 12px;font:inherit}label{font-weight:700}ol{padding-left:20px}</style></head><body><h1>Acceptance Checklist</h1><p>Source of truth: <code>test-results.json</code>. Use this viewer to record a run, then copy statuses and evidence into that JSON file.</p><div id="items"></div><button id="download">Download recorded results</button><script>const items=[{id:"A1",title:"Both participants’ different reactions are visible",steps:["User A sends a message.","User B reacts with an emoji.","User A reacts to that same message with a different emoji.","Observe the message in both threads after realtime update or refresh."],expected:"Both distinct emoji icons are visible in one compact badge for both users."},{id:"A2",title:"Matching reactions show the participant count",steps:["Have both users choose the same emoji on one message.","Observe the badge in both threads."],expected:"One emoji with a count of 2 is visible; neither reaction is hidden."},{id:"A3",title:"Bubble and status layout remain intact",steps:["Check incoming/outgoing, image-only, grouped, and themed messages with reactions.","Check a sent message with delivered or seen state at desktop and narrow mobile widths."],expected:"The badge does not overlap bubbles, images, timestamps, toolbars, or message status."},{id:"A4",title:"Frontend quality gates",steps:["Run npm run typecheck, npm run lint, and npm run build in frontend/."],expected:"Each command succeeds."}];const root=document.querySelector('#items');items.forEach(item=>root.insertAdjacentHTML('beforeend',`<article data-id="${item.id}"><h2>${item.id} — ${item.title}</h2><ol>${item.steps.map(step=>`<li>${step}</li>`).join('')}</ol><p><strong>Expected:</strong> ${item.expected}</p><label>Status <select><option>pending</option><option>pass</option><option>fail</option></select></label><textarea placeholder="Evidence / waiver / notes"></textarea></article>`));document.querySelector('#download').onclick=()=>{const output={status:'pending',items:[...document.querySelectorAll('article')].map(el=>({id:el.dataset.id,status:el.querySelector('select').value,evidence:el.querySelector('textarea').value}))};output.status=output.items.every(item=>item.status==='pass')?'passed':output.items.some(item=>item.status==='fail')?'failed':'pending';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));link.download='test-results-recorded.json';link.click()};</script></body></html>
