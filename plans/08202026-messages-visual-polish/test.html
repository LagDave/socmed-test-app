<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages Visual Polish Acceptance</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#0a0a0a}main{max-width:900px;margin:auto;padding:32px}header,article{border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:12px}h1,h2,p{margin-top:0}.pass{border-left:5px solid #16703c}code{background:#f5f5f5;padding:2px 4px;border-radius:3px}</style></head><body><main><header><h1>Messages visual polish acceptance</h1><p id="summary">Loading <code>test-results.json</code>…</p></header><section id="items"></section></main><script>fetch('./test-results.json').then(r=>r.json()).then(data=>{document.querySelector('#summary').textContent=`${data.status} · ${data.plan}`;document.querySelector('#items').innerHTML=data.items.map(i=>`<article class="${i.status}"><h2>${i.id} — ${i.title}</h2><p><strong>Status:</strong> ${i.status}</p><p><strong>Expected:</strong> ${i.expected}</p><p><strong>Evidence:</strong> ${i.evidence}</p></article>`).join('')})</script></body></html>
