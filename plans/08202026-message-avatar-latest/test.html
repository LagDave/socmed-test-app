<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Latest Message Avatar — Acceptance</title><style>:root{--paper:#fff;--ink:#111;--line:#d8d8d8;--soft:#f6f6f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{width:min(900px,calc(100% - 32px));margin:auto;padding:38px 0}header,article{border:1px solid var(--line);border-radius:10px;padding:22px}article{margin-top:14px}h1,h2{margin-top:0}button,select,textarea{font:inherit}button{border:1px solid var(--ink);border-radius:7px;background:var(--paper);padding:7px 11px;cursor:pointer}textarea{width:100%}ol{padding-left:22px}.pending{border-left:5px solid #956b00}.pass{border-left:5px solid #176b38}.fail{border-left:5px solid #a61b1b}</style></head><body><main><header><h1>Latest Message Avatar</h1><p>Acceptance viewer for <code>test-results.json</code>. Update statuses and evidence, then download the revised JSON.</p><p id="overall">Loading…</p><button id="download">Download updated test-results.json</button></header><section id="items" aria-live="polite"></section></main><script>const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./test-results.json').then(r=>r.json()).then(data=>{const items=document.querySelector('#items'),overall=document.querySelector('#overall');const render=()=>{const hasPending=data.items.some(i=>i.status==='pending'),hasFail=data.items.some(i=>i.status==='fail'&&!i.waiver);data.status=hasFail?'Failed':hasPending?'In Progress':'Passed';overall.textContent=`Status: ${data.status}`;items.innerHTML=data.items.map((i,n)=>`<article class="${esc(i.status)}"><h2>${esc(i.id)} — ${esc(i.title)}</h2><label>Status: <select data-i="${n}" data-f="status"><option value="pending" ${i.status==='pending'?'selected':''}>pending</option><option value="pass" ${i.status==='pass'?'selected':''}>pass</option><option value="fail" ${i.status==='fail'?'selected':''}>fail</option></select></label><p><strong>Precondition:</strong> ${esc(i.precondition)}</p><strong>Steps</strong><ol>${i.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><strong>Expected:</strong> ${esc(i.expected)}</p><label><strong>Evidence</strong><textarea rows="3" data-i="${n}" data-f="evidence">${esc(i.evidence)}</textarea></label><label><strong>Waiver</strong><textarea rows="2" data-i="${n}" data-f="waiver">${esc(i.waiver)}</textarea></label></article>`).join('')};items.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){data.items[Number(e.target.dataset.i)][f]=e.target.value;render()}});items.addEventListener('input',e=>{const f=e.target.dataset.f;if(f)data.items[Number(e.target.dataset.i)][f]=e.target.value});document.querySelector('#download').onclick=()=>{const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'})),download:'test-results.json'});a.click();URL.revokeObjectURL(a.href)};render()}).catch(()=>{document.querySelector('#overall').textContent='Unable to load test-results.json'});</script></body></html>
