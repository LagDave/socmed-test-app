<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceptance Checklist — Remove Load-Earlier Button</title><style>body{max-width:850px;margin:36px auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#111}article{border:1px solid #ddd;border-radius:8px;padding:18px;margin:14px 0}h1{line-height:1.1}textarea{width:100%;min-height:56px;margin-top:8px}button{padding:9px 12px;font:inherit}label{font-weight:700}ol{padding-left:20px}</style></head><body><h1>Acceptance Checklist</h1><p>Source of truth: <code>test-results.json</code>. Use this viewer to record any subsequent run, then copy the evidence and statuses into that JSON file.</p><div id="items"></div><button id="download">Download recorded results</button><script>const items=[{id:"A1",title:"Earlier history loads automatically at the thread top",steps:["Open a multi-page conversation at its newest messages.","Confirm the button is absent, then scroll to the top.","Repeat until there is no more history."],expected:"Pages load once automatically and remain chronological."},{id:"A2",title:"Frontend quality gates",steps:["Run typecheck, lint, and build in frontend/."],expected:"Every command succeeds."},{id:"A3",title:"Compact bubbles and time gaps",steps:["Check incoming/outgoing bubbles, a sender-independent time gap, reaction clearance, and pink-theme timestamp contrast."],expected:"Grouped bubbles are compact; time gaps are labeled and readable; reaction clearance remains."},{id:"A4",title:"Search-result continuation",steps:["Select an older search result in a multi-page conversation.","Scroll down until newer context loads, then continue to the latest message.","Scroll back up to confirm older loading continues."],expected:"Both directions paginate once per boundary without duplicates or reordering."},{id:"A5",title:"Hidden chat scrollbar",steps:["Open an overflowing chat at desktop and mobile widths.","Confirm the right-edge scrollbar is hidden.","Scroll with wheel, touch, keyboard, and pagination."],expected:"The pane still scrolls and paginates normally without a visible scrollbar."}];const root=document.querySelector('#items');items.forEach(item=>root.insertAdjacentHTML('beforeend',`<article data-id="${item.id}"><h2>${item.id} — ${item.title}</h2><ol>${item.steps.map(step=>`<li>${step}</li>`).join('')}</ol><p><strong>Expected:</strong> ${item.expected}</p><label>Status <select><option>pending</option><option>pass</option><option>fail</option></select></label><textarea placeholder="Evidence / waiver / notes"></textarea></article>`));document.querySelector('#download').onclick=()=>{const output={status:'pending',items:[...document.querySelectorAll('article')].map(el=>({id:el.dataset.id,status:el.querySelector('select').value,evidence:el.querySelector('textarea').value}))};output.status=output.items.every(item=>item.status==='pass')?'passed':output.items.some(item=>item.status==='fail')?'failed':'pending';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));link.download='test-results-recorded.json';link.click()};</script></body></html>
