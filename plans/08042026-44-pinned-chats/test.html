<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pinned Chats Reconciliation Acceptance</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#111}article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}small{color:#666}textarea{width:100%;min-height:54px}button{padding:8px 12px}code{background:#f4f4f4;padding:2px 4px}</style></head><body><h1>Pinned Chats Reconciliation Acceptance</h1><p>Load <code>test-results.json</code>, record only observed evidence, then download the updated JSON.</p><input id="file" type="file" accept="application/json"><button id="download" disabled>Download results</button><main id="items"></main><script>let data;const items=document.querySelector('#items'),download=document.querySelector('#download');document.querySelector('#file').onchange=async e=>{data=JSON.parse(await e.target.files[0].text());items.innerHTML='';data.items.forEach((x,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${x.title}</h2><small>${x.surface} · ${x.id}</small><p><b>Precondition:</b> ${x.precondition}</p><p><b>Steps:</b> ${x.steps.join(' → ')}</p><p><b>Expected:</b> ${x.expected}</p><label>Status <select><option>pending</option><option>pass</option><option>fail</option></select></label><p><label>Evidence<textarea></textarea></label></p><p><label>Notes / waiver<textarea></textarea></label></p>`;const [status,evidence,notes]=a.querySelectorAll('select,textarea');status.value=x.status;evidence.value=x.evidence;notes.value=x.notes||x.waiver||'';status.onchange=()=>x.status=status.value;evidence.oninput=()=>x.evidence=evidence.value;notes.oninput=()=>x.notes=notes.value;items.append(a)});download.disabled=false};download.onclick=()=>{data.status=data.items.every(x=>x.status==='pass'||x.waiver)?'Passed':'Not Run';const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='test-results.json';a.click();URL.revokeObjectURL(u)};</script></body></html>
