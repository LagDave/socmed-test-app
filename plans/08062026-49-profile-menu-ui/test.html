<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile Menu UI Acceptance</title>
  <style>
    :root{color-scheme:light;--paper:#fff;--ink:#080808;--muted:#5f5f5f;--line:#d8d8d8;--soft:#f5f5f5;--pass:#0a6b2e;--fail:#9b1c1c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5}.shell{width:min(960px,calc(100% - 32px));margin:0 auto;padding:40px 0}.hero,.item{border:1px solid var(--line);border-radius:8px}.hero{border-color:var(--ink);padding:28px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.eyebrow{margin:0;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.pill{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font-size:.76rem;font-weight:800;text-transform:uppercase}.pill.passed{background:var(--pass);border-color:var(--pass)}.pill.failed{background:var(--fail);border-color:var(--fail)}h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{border:1px solid var(--ink);border-radius:8px;padding:8px 14px;background:var(--paper);font:inherit;font-weight:700;cursor:pointer}.item{margin:10px 0;padding:16px}.item.pass{border-left:4px solid var(--pass)}.item.fail{border-left:4px solid var(--fail)}.item h3{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px;font-size:1rem}.tag,.status{font-size:.68rem;font-weight:800;text-transform:uppercase}.tag{padding:1px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status.pass{color:var(--pass)}.status.fail{color:var(--fail)}.status.pending{color:var(--muted)}dt{margin-top:8px;color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase}dd{margin:2px 0}ol{margin:4px 0 0 20px;padding:0}.notice{border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--soft)}code{padding:.05rem .3rem;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
  </style>
</head>
<body>
  <main class="shell"><header class="hero"><div class="top"><p class="eyebrow">Socmed Acceptance Tests</p><span class="pill" id="pill">Not Run</span></div><h1 id="title">Profile Menu UI Acceptance</h1><p class="eyebrow" id="meta"></p></header><div class="bar"><input id="file" type="file" accept="application/json" hidden><button id="load">Load results file</button><button id="save">Download updated results</button></div><div class="notice" id="notice" hidden></div><div id="list"></div></main>
  <script>
    let data;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const rollup=d=>{const a=d.items||[];if(!a.length||a.every(i=>i.status==="pending"))return"Not Run";if(a.some(i=>i.status==="fail"&&!i.waiver))return"Failed";return a.every(i=>i.status==="pass"||(i.status==="fail"&&i.waiver))?"Passed":"In Progress"};
    function render(){if(!data)return;data.status=rollup(data);$("title").textContent=data.plan||"Acceptance Tests";$("meta").textContent=`Plan: ${data.plan||"—"} · generated ${data.generatedAt||"—"}`;const p=$("pill");p.textContent=data.status;p.className="pill "+data.status.toLowerCase().replace(/\s/g,"");$("list").innerHTML=(data.items||[]).map((i,n)=>`<article class="item ${i.status}"><h3><input type="checkbox" data-i="${n}" ${i.status==="pass"?"checked":""}>${esc(i.title||i.id)}<span class="tag">${esc(i.surface)}</span><span class="status ${i.status}">${esc(i.status)}</span></h3><dl>${i.precondition?`<dt>Precondition</dt><dd>${esc(i.precondition)}</dd>`:""}${i.steps?.length?`<dt>Steps</dt><ol>${i.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}${i.expected?`<dt>Expected</dt><dd>${esc(i.expected)}</dd>`:""}${i.evidence?`<dt>Evidence</dt><dd>${esc(i.evidence)}</dd>`:""}${i.notes?`<dt>Notes</dt><dd>${esc(i.notes)}</dd>`:""}${i.waiver?`<dt>Waiver</dt><dd>${esc(i.waiver)}</dd>`:""}</dl></article>`).join("");document.querySelectorAll("input[type=checkbox]").forEach(x=>x.addEventListener("change",e=>{data.items[+e.target.dataset.i].status=e.target.checked?"pass":"pending";render()}))}
    function loadFile(f){const r=new FileReader;r.onload=()=>{try{data=JSON.parse(r.result);$("notice").hidden=true;render()}catch(e){$("notice").textContent=`Could not parse JSON: ${e.message}`;$("notice").hidden=false}};r.readAsText(f)}$("load").onclick=()=>$("file").click();$("file").onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);$("save").onclick=()=>{if(!data)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="test-results.json";a.click()};fetch("./test-results.json").then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{$("notice").innerHTML="Couldn't auto-load <code>test-results.json</code> over file://. Choose Load results file.";$("notice").hidden=false});
  </script>
</body>
</html>
