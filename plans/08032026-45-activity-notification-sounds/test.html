<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR #61 Acceptance</title>
  <style>
    :root{--ink:#111;--line:#d8d8d8;--soft:#f5f5f5;--pass:#136f3a;--muted:#666}*{box-sizing:border-box}body{margin:0;font:16px/1.5 ui-sans-serif,system-ui;color:var(--ink)}main{width:min(900px,calc(100% - 32px));margin:auto;padding:40px 0}header,.item{border:1px solid var(--line);border-radius:9px;padding:20px;margin-bottom:12px}header{border-color:var(--ink)}h1,h3{margin-top:0}.meta{font-size:.8rem;font-weight:800;text-transform:uppercase;color:var(--muted)}.pass{border-left:4px solid var(--pass)}.status{font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--pass)}dt{margin-top:10px;color:var(--muted);font-size:.72rem;font-weight:800;text-transform:uppercase}dd{margin:2px 0}button{border:1px solid var(--ink);border-radius:6px;background:#fff;padding:7px 10px;font:inherit;font-weight:700;cursor:pointer}ol{margin:4px 0 0;padding-left:20px}
  </style>
</head>
<body>
  <main>
    <header><p class="meta">Socmed acceptance checklist</p><h1 id="title">Loading…</h1><p id="summary"></p><button id="download">Download updated results</button></header>
    <div id="items"></div>
  </main>
  <script>
    const esc = value => String(value || "").replace(/[&<>"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
    let data;
    function render() {
      document.querySelector("#title").textContent = data.plan;
      const passing = data.items.filter(item => item.status === "pass").length;
      document.querySelector("#summary").textContent = `${passing}/${data.items.length} checks passed · ${data.status}`;
      document.querySelector("#items").innerHTML = data.items.map((item, index) => `<article class="item ${item.status === "pass" ? "pass" : ""}"><h3><input data-index="${index}" type="checkbox" ${item.status === "pass" ? "checked" : ""}> ${esc(item.id)} — ${esc(item.title)} <span class="status">${esc(item.status)}</span></h3><dl><dt>Precondition</dt><dd>${esc(item.precondition)}</dd><dt>Steps</dt><dd><ol>${item.steps.map(step => `<li>${esc(step)}</li>`).join("")}</ol></dd><dt>Expected</dt><dd>${esc(item.expected)}</dd><dt>Evidence</dt><dd>${esc(item.evidence)}</dd><dt>Notes</dt><dd>${esc(item.notes)}</dd></dl></article>`).join("");
      document.querySelectorAll("input").forEach(input => input.addEventListener("change", event => { data.items[event.target.dataset.index].status = event.target.checked ? "pass" : "pending"; data.status = data.items.every(item => item.status === "pass" || item.waiver) ? "Passed" : "In Progress"; render(); }));
    }
    document.querySelector("#download").addEventListener("click", () => { const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:"application/json"})); link.download = "test-results.json"; link.click(); });
    fetch("./test-results.json").then(response => response.json()).then(json => { data = json; render(); });
  </script>
</body>
</html>
