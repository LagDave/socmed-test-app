<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Acceptance Checklist — Compact relative timestamps</title><style>body{max-width:850px;margin:36px auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#111}article{border:1px solid #ddd;border-radius:8px;padding:18px;margin:14px 0}h1{line-height:1.1}textarea{width:100%;min-height:56px;margin-top:8px}button{padding:9px 12px;font:inherit}label{font-weight:700}ol{padding-left:20px}</style></head>
<body><h1>Acceptance Checklist</h1><p>Source of truth: <code>test-results.json</code>. Record observed evidence here, then copy it into that JSON file.</p><div id="items"></div><button id="download">Download recorded results</button><script>const items=[{id:"A1",title:"Shared compact bucket and future-time contract",steps:["Check now, minute, hour, day, week, month, and year values against a fixed now.","Check a future value and invalid input."],expected:"now / Nmin / Nhr / Nd / Nw / Nmo / Nyr; future is in Nunit; invalid input is empty."},{id:"A2",title:"Comment and reply timestamp placement",steps:["Inspect a root comment and reply.","Confirm each compact time follows the author display name, not Like/Reply.","Hover each time element and use Like and Reply."],expected:"Compact labels beside the author name with unchanged absolute hover titles; Like/Reply controls remain functional in the meta row."},{id:"A3",title:"Message surfaces",steps:["Inspect a conversation row, message bubble, and message-search result.","Hover existing row and bubble time elements."],expected:"All labels are compact; existing absolute hover titles and search layout remain unchanged."},{id:"A4",title:"Notifications and future distinction",steps:["Inspect and hover a notification timestamp.","Confirm future output via fixture or A1."],expected:"Compact notification label, unchanged absolute hover title, and in prefix for future buckets."}];const root=document.querySelector("#items");items.forEach(item=>root.insertAdjacentHTML("beforeend",`<article data-id="${item.id}"><h2>${item.id} — ${item.title}</h2><ol>${item.steps.map(step=>`<li>${step}</li>`).join("")}</ol><p><strong>Expected:</strong> ${item.expected}</p><label>Status <select><option>pending</option><option>pass</option><option>fail</option></select></label><textarea placeholder="Evidence / waiver / notes"></textarea></article>`));document.querySelector("#download").onclick=()=>{const output={status:"pending",items:[...document.querySelectorAll("article")].map(element=>({id:element.dataset.id,status:element.querySelector("select").value,evidence:element.querySelector("textarea").value}))};output.status=output.items.every(item=>item.status==="pass")?"passed":output.items.some(item=>item.status==="fail")?"failed":"pending";const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:"application/json"}));link.download="test-results-recorded.json";link.click()};</script></body>
</html>
