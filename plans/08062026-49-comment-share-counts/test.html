<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceptance Checklist — Comment and share counts</title><style>body{max-width:850px;margin:36px auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#111}article{border:1px solid #ddd;border-radius:8px;padding:18px;margin:14px 0}h1{line-height:1.1}textarea{width:100%;min-height:56px;margin-top:8px}button{padding:9px 12px;font:inherit}label{font-weight:700}ol{padding-left:20px}</style></head><body><h1>Acceptance Checklist</h1><p>Source of truth: <code>test-results.json</code>. Record observed evidence here, then copy it into that JSON file.</p><div id="items"></div><button id="download">Download recorded results</button><script>const items=[{id:"A1",title:"Root comment count",steps:["Fetch a post with root and image comments.","Compare commentCount to root comments only."],expected:"Only post-level comments are included."},{id:"A2",title:"Share count and batch behavior",steps:["Fetch a multi-post feed fixture.","Compare direct shares and inspect query count."],expected:"Counts are correct without a per-post query loop."},{id:"A3",title:"Action count presentation",steps:["Inspect zero, positive, and 100+ count fixtures.","Inspect control accessibility labels."],expected:"Counts are legible, cap visually at 99+, and preserve the full accessible number."},{id:"A4",title:"Timestamp presentation",steps:["Inspect comments, messages, friend rows, and posts."],expected:"Relative timestamps remain readable and comment titles expose an absolute time."}];const root=document.querySelector('#items');items.forEach(item=>root.insertAdjacentHTML('beforeend',`<article data-id="${item.id}"><h2>${item.id} — ${item.title}</h2><ol>${item.steps.map(step=>`<li>${step}</li>`).join('')}</ol><p><strong>Expected:</strong> ${item.expected}</p><label>Status <select><option>pending</option><option>pass</option><option>fail</option></select></label><textarea placeholder="Evidence / waiver / notes"></textarea></article>`));document.querySelector('#download').onclick=()=>{const output={status:'pending',items:[...document.querySelectorAll('article')].map(el=>({id:el.dataset.id,status:el.querySelector('select').value,evidence:el.querySelector('textarea').value}))};output.status=output.items.every(item=>item.status==='pass')?'passed':output.items.some(item=>item.status==='fail')?'failed':'pending';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));link.download='test-results-recorded.json';link.click()};</script></body></html>
